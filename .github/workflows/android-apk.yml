name: Compila CarCode Scanner 2.2
on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify signing credentials exist
        env:
          CARCODE_P12_BASE64: ${{ secrets.CARCODE_P12_BASE64 }}
          CARCODE_P12_PASSWORD: ${{ secrets.CARCODE_P12_PASSWORD }}
        run: |
          test -n "$CARCODE_P12_BASE64" || { echo 'Missing CARCODE_P12_BASE64'; exit 1; }
          test -n "$CARCODE_P12_PASSWORD" || { echo 'Missing CARCODE_P12_PASSWORD'; exit 1; }
          printf '%s' "$CARCODE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/carcode.p12"
          keytool -list -keystore "$RUNNER_TEMP/carcode.p12" -storetype PKCS12 -storepass "$CARCODE_P12_PASSWORD" > /dev/null
      - name: Compile release
        run: gradle --no-daemon assembleRelease
      - name: Sign APK with original private key
        env:
          CARCODE_P12_PASSWORD: ${{ secrets.CARCODE_P12_PASSWORD }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          apksigner sign --ks "$RUNNER_TEMP/carcode.p12" --ks-type PKCS12 --ks-key-alias carcode-scanner --ks-pass env:CARCODE_P12_PASSWORD --key-pass env:CARCODE_P12_PASSWORD --out CarCode-Scanner-2.2.apk "$RUNNER_TEMP/aligned.apk"
          apksigner verify --verbose CarCode-Scanner-2.2.apk
      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: CarCode-Scanner-2.2
          path: CarCode-Scanner-2.2.apk
