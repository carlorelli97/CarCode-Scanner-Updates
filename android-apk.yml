name: Compila CarCode Scanner 2.8

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Regression tests
        run: bash tests/run.sh

      - name: Verify signing credentials
        env:
          CARCODE_P12_BASE64: ${{ secrets.CARCODE_P12_BASE64 }}
          CARCODE_P12_PASSWORD: ${{ secrets.CARCODE_P12_PASSWORD }}
        run: |
          test -n "$CARCODE_P12_BASE64"
          test -n "$CARCODE_P12_PASSWORD"
          printf '%s' "$CARCODE_P12_BASE64" | base64 -d > "$RUNNER_TEMP/carcode.p12"
          chmod 600 "$RUNNER_TEMP/carcode.p12"
          keytool -list -keystore "$RUNNER_TEMP/carcode.p12" -storetype PKCS12 -storepass "$CARCODE_P12_PASSWORD" > /dev/null

      - name: Compile release
        run: gradle --no-daemon assembleRelease

      - name: Sign APK
        env:
          CARCODE_P12_PASSWORD: ${{ secrets.CARCODE_P12_PASSWORD }}
        run: |
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          zipalign -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          apksigner sign --ks "$RUNNER_TEMP/carcode.p12" --ks-type PKCS12 --ks-key-alias carcode-scanner --ks-pass env:CARCODE_P12_PASSWORD --key-pass env:CARCODE_P12_PASSWORD --out CarCode-Scanner-2.8.apk "$RUNNER_TEMP/aligned.apk"
          apksigner verify --verbose --print-certs CarCode-Scanner-2.8.apk | tee "$RUNNER_TEMP/scanner-signature.txt"
          grep -Eiq "certificate SHA-256 digest: e662e9e755091deff32a8ff8e02ed92ddae39089ce85c42701f46b6a3715d384" "$RUNNER_TEMP/scanner-signature.txt"
          aapt dump badging CarCode-Scanner-2.8.apk | grep "^package:"
          aapt dump badging CarCode-Scanner-2.8.apk | grep -q "versionName='2.8'"

      - name: Download APK
        uses: actions/upload-artifact@v4
        with:
          name: CarCode-Scanner-2.8
          path: CarCode-Scanner-2.8.apk

      - name: Cleanup
        if: always()
        run: rm -f "$RUNNER_TEMP/carcode.p12"
